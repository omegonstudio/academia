# Base topology shared by both environments.
#
# Pair with exactly one override (scripts/dev-up.sh and scripts/prod-up.sh do):
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml  up
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up
#
# Development convenience: `.env.example` sets COMPOSE_FILE to the base+dev pair
# and COMPOSE_PROJECT_NAME=academia-dev so bare `docker compose up` matches
# `npm run dev`. Prefer `npm run dev` when you want an explicit health wait.
#
# Environment isolation rests on COMPOSE_PROJECT_NAME: it namespaces the volumes
# and the network, so a dev stack can never attach to production data. The
# scripts always export academia-dev / academia-prod for their invocations.
#
# Each service receives only the variables it needs. The web container is not
# given DATABASE_URL or AUTH_SECRET.

name: ${COMPOSE_PROJECT_NAME:-academia}

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  api:
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      API_PORT: 4000
      # Discrete parameters, not a pre-built URL. The entrypoint assembles
      # DATABASE_URL with percent-encoding so a "/" in the password cannot make
      # the URL unparseable. The POSTGRES_* values remain the single source of
      # truth for credentials.
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Escape hatch for a managed database that provides a ready-made URL.
      # Deliberately not named DATABASE_URL: that variable in .env targets
      # localhost for host-side tooling and would be wrong inside the container.
      DATABASE_URL: ${DATABASE_URL_OVERRIDE:-}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      AUTH_SESSION_TTL: ${AUTH_SESSION_TTL:-604800}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-omegon.info@gmail.com}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-}
      LOAD_SEED_DATA: ${LOAD_SEED_DATA:-false}
      # Academy business IANA timezone (ScheduleOption local → ClassSession timestamptz).
      ACADEMY_TIMEZONE: ${ACADEMY_TIMEZONE:-America/Argentina/Buenos_Aires}
      # S3-compatible object storage (MinIO in development; Spaces in production).
      S3_ENDPOINT: ${S3_ENDPOINT:?S3_ENDPOINT is required}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      MATERIAL_MAX_PDF_BYTES: ${MATERIAL_MAX_PDF_BYTES:-20971520}
      MATERIAL_MAX_IMAGE_BYTES: ${MATERIAL_MAX_IMAGE_BYTES:-5242880}
      MATERIAL_MAX_AUDIO_BYTES: ${MATERIAL_MAX_AUDIO_BYTES:-31457280}
      MATERIAL_UPLOAD_URL_TTL_SECONDS: ${MATERIAL_UPLOAD_URL_TTL_SECONDS:-900}
      MATERIAL_DOWNLOAD_URL_TTL_SECONDS: ${MATERIAL_DOWNLOAD_URL_TTL_SECONDS:-120}
    depends_on:
      db:
        condition: service_healthy
    # Uses the real /health contract rather than a page that merely returns 200,
    # so an unreachable database marks the container unhealthy.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  web:
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      WEB_PORT: 3000
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      # Same default as docker/web.Dockerfile and docker-compose.prod.yml
      # build.args — one variable for rewrites (build) and getSession (runtime).
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:4000}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
