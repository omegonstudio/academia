# Production override.
#
# Differences from development, all intentional:
#   - the database publishes no host port; it is reachable only on the internal
#     network
#   - no bind mounts: images are immutable build artefacts
#   - only the web service is exposed, so the API is not directly addressable
#     from outside the compose network
#
# Secrets come from the server environment or GitHub Secrets, never from a file
# in the repository. A TLS terminator (nginx/Traefik/Caddy) is expected in front
# of the published web port; see docs/INFRASTRUCTURE.md.

services:
  db:
    volumes:
      - db_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      NODE_ENV: production
    # No `ports`: reachable only as http://api:4000 inside the network.
    expose:
      - '4000'

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        # Baked into the build: Next.js resolves rewrite destinations and
        # inlines NEXT_PUBLIC_* at build time, not at runtime.
        API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:4000}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?NEXT_PUBLIC_APP_URL is required}
    environment:
      NODE_ENV: production
      # Same variable as build.args so rewrites and getSession() cannot diverge.
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:4000}
    ports:
      - '${WEB_PORT:-3000}:3000'

volumes:
  db_data:
