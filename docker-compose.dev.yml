# Development override.
#
# Differences from production, all intentional:
#   - the database port is published so host tooling (psql, prisma) can reach it
#   - sources are bind-mounted for hot reload
#   - node_modules and build caches live in anonymous volumes so the container's
#     installs are not shadowed by the host's. Those volumes are seeded once;
#     after dependency changes the API/web entrypoints re-run `npm ci` when
#     package-lock.json's hash drifts (see docker/sync-node-modules.sh).
#   - images are built from the .dev Dockerfiles, which keep the dev toolchain
#   - MinIO is optional (`--profile materials`) for Materials/S3 smoke. Auth,
#     membership UI, and most CRUD do not require it. Quay.io pulls for MinIO
#     have been flaky in some networks; keep Materials out of the default path.

services:
  db:
    ports:
      # Host 5433 by default: leaves a locally installed PostgreSQL on 5432 alone.
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - db_data_dev:/var/lib/postgresql/data

  minio:
    profiles: ['materials']
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-academia-dev-access-key}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-academia-dev-secret-key}
    ports:
      - '${MINIO_API_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio_data_dev:/data
    restart: unless-stopped

  minio-init:
    profiles: ['materials']
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      - minio
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-academia-dev-access-key}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-academia-dev-secret-key}
      MINIO_BUCKET: ${S3_BUCKET:-academia-materials}
    volumes:
      - ./docker/minio/create-bucket.sh:/create-bucket.sh:ro
    entrypoint: ['/bin/sh', '/create-bucket.sh']
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: docker/api.dev.Dockerfile
    environment:
      NODE_ENV: development
      # In-compose MinIO when profile `materials` is enabled. Without MinIO,
      # Materials upload routes fail at request time; /health stays ok.
      S3_ENDPOINT: ${S3_ENDPOINT_DOCKER:-http://minio:9000}
      # Presigned URLs for the host browser / curl against published port 9000.
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://127.0.0.1:9000}
      S3_BUCKET: ${S3_BUCKET:-academia-materials}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-academia-dev-access-key}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-academia-dev-secret-key}
      S3_FORCE_PATH_STYLE: 'true'
    ports:
      - '${API_PORT:-4000}:4000'
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages/shared:/app/packages/shared
      - ./package.json:/app/package.json
      - ./package-lock.json:/app/package-lock.json
      - ./tsconfig.base.json:/app/tsconfig.base.json
      # Anonymous volumes: keep the image's installed trees intact.
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/packages/shared/node_modules
      # Prisma client is gitignored and may be root-owned on the host from an
      # older container run. Shadow it so `prisma generate` always has a
      # writable path inside the container.
      - /app/apps/api/src/generated

  web:
    build:
      context: .
      dockerfile: docker/web.dev.Dockerfile
    environment:
      NODE_ENV: development
      # Container → API service name (never host localhost).
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:4000}
    ports:
      - '${WEB_PORT:-3000}:3000'
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages/shared:/app/packages/shared
      - ./package.json:/app/package.json
      - ./package-lock.json:/app/package-lock.json
      - ./tsconfig.base.json:/app/tsconfig.base.json
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/apps/web/.next
      - /app/packages/shared/node_modules

volumes:
  db_data_dev:
  minio_data_dev:
